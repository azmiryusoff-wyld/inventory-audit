{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Inventory Audit{% endblock %}</title>
<style>
  :root { --ink:#1d2433; --muted:#667085; --line:#e4e7ec; --bg:#f7f8fa; --card:#fff;
          --accent:#2f5aa8; --good:#1a7f4b; --bad:#b42318; --warn:#b54708; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--ink); color:#fff; padding:10px 16px; display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
  header a { color:#fff; text-decoration:none; opacity:.85 } header a:hover { opacity:1 }
  header .brand { font-weight:700; opacity:1; margin-right:auto }
  main { max-width:1280px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:8px 0 4px } h2 { font-size:16px; margin:24px 0 8px }
  .muted { color:var(--muted) }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:14px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); }
  .kpi .label { color:var(--muted); font-size:12px } .kpi .value { font-size:20px; font-weight:600; font-variant-numeric:tabular-nums }
  table { width:100%; border-collapse:collapse; background:var(--card); font-variant-numeric:tabular-nums }
  th, td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top }
  th { font-size:12px; color:var(--muted); font-weight:600; position:sticky; top:0; background:var(--card) }
  td.n, th.n { text-align:right; white-space:nowrap }
  .scroll { overflow-x:auto; border:1px solid var(--line); border-radius:8px; max-height:70vh }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin:12px 0 16px; flex-wrap:wrap }
  .tabs a { padding:8px 12px; text-decoration:none; color:var(--muted); border-bottom:2px solid transparent }
  .tabs a.on { color:var(--ink); border-color:var(--accent); font-weight:600 }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; font-weight:600 }
  .PASS, .OK, .STAR { background:#e7f6ee; color:var(--good) }
  .REVIEW, .DOG { background:#fdecea; color:var(--bad) }
  .PLOWHORSE, .PUZZLE { background:#fff4e5; color:var(--warn) }
  .pos { color:var(--bad) } .neg { color:var(--good) }
  .msg { padding:8px 12px; border-radius:6px; margin-bottom:8px } .msg.success { background:#e7f6ee } .msg.error { background:#fdecea } .msg.warning { background:#fff4e5 }
  form.inline { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  input, select, button { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:#fff }
  button, .btn { background:var(--accent); color:#fff; border:0; cursor:pointer; padding:6px 12px; border-radius:6px; text-decoration:none; display:inline-block }
  details summary { cursor:pointer }
  a { color:var(--accent) }
</style>
</head>
<body>
<header>
  <a class="brand" href="{% url 'home' %}">Inventory Audit</a>
  <a href="{% url 'home' %}">Audits</a>
  <a href="{% url 'trends' %}">Trends</a>
  <a href="{% url 'admin:index' %}">Master data</a>
  {% if user.is_authenticated %}<span class="muted">{{ user.get_username }}</span>
  <form method="post" action="{% url 'admin:logout' %}" style="margin:0">{% csrf_token %}<button style="background:none;padding:0;opacity:.85">Log out</button></form>{% endif %}
</header>
<main>
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
